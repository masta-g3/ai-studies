<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paper Selection Experiment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>LLM Paper Selection Experiment</h1>
      <p class="subtitle">Comparing single-shot vs multi-run consensus</p>
    </header>

    <section id="headline-stats"></section>

    <section id="comparison">
      <div class="comparison-container">
        <div class="column" id="single-shot-column">
          <h2>Single-shot <span class="count"></span></h2>
          <div class="paper-list"></div>
        </div>
        <div class="column" id="consensus-column">
          <h2>Consensus <span class="threshold">>50%</span> <span class="count"></span></h2>
          <div class="paper-list"></div>
        </div>
      </div>
    </section>

    <section id="frequency-section">
      <h2 class="collapsible">
        <span class="toggle-icon">&#x25BC;</span>
        All Selections <span class="count"></span>
        <select id="sort-select">
          <option value="frequency">Sort by frequency</option>
          <option value="title">Sort by title</option>
        </select>
      </h2>
      <div class="paper-list" id="frequency-list"></div>
    </section>
  </main>

  <div id="tooltip"></div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
