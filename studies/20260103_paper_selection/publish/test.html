<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paper Selection Viz - Test Harness</title>
  <style>
    :root {
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, monospace;
      --black: #1a1a1a;
      --mid-gray: #666;
      --border-color: #e0e0e0;
      --code-bg: #f5f5f5;
      --paper: #fff;
    }
    body {
      margin: 0;
      padding: 48px 0;
      background: var(--paper);
    }
  </style>
  <link rel="stylesheet" href="viz/style.css">
</head>
<body>
  <div id="viz-container"></div>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script>
    window.VIZ_MODELS_PATH = './viz/models.json';
    window.VIZ_DATA_BASE = './viz/';
    fetch('./viz/app.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('viz-container').innerHTML = html;
        const script = document.createElement('script');
        script.src = './viz/main.js';
        script.onload = () => init();
        document.body.appendChild(script);
      });
  </script>
</body>
</html>
