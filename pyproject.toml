[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-studies"
version = "0.1.0"
description = "Research repository for exploring embedding concepts from ML"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "litellm>=1.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
